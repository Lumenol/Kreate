name: Build test APK

# Builds an installable, signed APK to test patches before they're proposed upstream.
#
# It builds the "nightly" variant, whose signing config is the only one this repo
# applies unconditionally (the "prod" one is gated behind OFFICIAL_BUILD_PASSPHRASE,
# which only knighthat/Kreate holds). Signing with a stable key of our own is what
# makes successive builds installable as updates rather than requiring an uninstall.
#
# The nightly variant suffixes the application id with ".nightly", so the result
# installs side-by-side with a regular Kreate install.
#
# Required secrets: NIGHTLY_KEYSTORE (base64 of a JKS with a "nightly" key alias),
# STORE_PASSWORD, KEY_PASSWORD.

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
      - 'test/**'

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PATH: .ignore.d/keystores
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Restore keystore
        run: |
          mkdir -p "$KEYSTORE_PATH"
          echo "${{ secrets.NIGHTLY_KEYSTORE }}" | base64 -d > "$KEYSTORE_PATH/nightly.jks"

      - name: Setup Java 21
        uses: actions/setup-java@v5.5.0
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Restore Gradle dependencies & build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ./build
            ./composeApp/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew :composeApp:testGithubUniversalNightlyReleaseUnitTest

      - name: Build with Gradle
        run: ./gradlew assembleGithubUniversalNightlyRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: kreate-nightly-apk
          path: composeApp/build/outputs/apk/githubUniversalNightly/release/*.apk
          if-no-files-found: error
